# Οι διορθώσεις και τα προβλήματα που λύνει η καθεμία.
#
# resolves    τα ονόματα πρέπει να είναι ίδια με του severity_semrush.yaml
# minutes     εκτίμηση, θα μετρηθεί στην πράξη
# depends_on  διορθώσεις που πρέπει να γίνουν πριν
# reaudit     true αν μετά χρειάζεται νέο crawl
# confidence  hypothesis όσο δεν έχει δοκιμαστεί, verified μετά
#
# Η πρώτη εκδοχή καλύπτει μόνο τα προβλήματα του audit της 4/10/2026.

fixes:
  - id: F01_routing
    name: Να δουλεύουν ξανά οι εσωτερικές σελίδες (.htaccess / permalinks)
    where: server
    how: >
      Στο cPanel, έλεγχος σε ποιον φάκελο δείχνει το subdomain και αν υπάρχουν
      εκεί το index.php και το .htaccess. Μετά, Ρυθμίσεις > Μόνιμοι σύνδεσμοι > Αποθήκευση.
    resolves:
      - "4xx errors"
      - "Broken internal links"
      - "Sitemap.xml not found"
      - "Issues with incorrect hreflang links"
    minutes: 15
    depends_on: []
    reaudit: true
    confidence: hypothesis
    source: "TODO"
    notes: >
      Οι εσωτερικές σελίδες βγάζουν 404 από τον Apache, δηλαδή δεν φτάνουν στο WordPress.
      Το audit είδε μόνο 22 URLs, οπότε μετά τη διόρθωση μάλλον θα εμφανιστούν κι άλλα
      προβλήματα. Το hreflang πιθανότατα φτιάχνεται επειδή θα ανοίγει το /en/home/.

  - id: F02_browser_caching
    name: Browser caching για JS και CSS
    where: caching_plugin
    how: Από το caching plugin, ή με Cache-Control / Expires στο .htaccess.
    resolves:
      - "Uncached JavaScript and CSS files"
    minutes: 20
    depends_on: []
    reaudit: false
    confidence: hypothesis
    source: "TODO"

  - id: F03_hsts
    name: Header HSTS
    where: server
    how: Strict-Transport-Security στο .htaccess ή από security plugin.
    resolves:
      - "No HSTS support"
    minutes: 10
    depends_on: []
    reaudit: false
    confidence: hypothesis
    source: "TODO"
    notes: Μόνο αν όλο το site και τα subdomains δουλεύουν με HTTPS.

  - id: F04_home_meta_description
    name: Meta description στην αρχική
    where: seo_plugin
    how: Από το πεδίο του SEO plugin για την αρχική σελίδα.
    resolves:
      - "Missing meta description"
    minutes: 5
    depends_on: []
    reaudit: false
    confidence: hypothesis
    source: "TODO"

  - id: F05_home_content
    name: Περισσότερο κείμενο στην αρχική
    where: content
    how: Προσθήκη κειμένου από τον editor.
    resolves:
      - "Low word count"
      - "Low text to HTML ratio"
    minutes: 45
    depends_on: []
    reaudit: false
    confidence: hypothesis
    source: "TODO"
    notes: Είναι θέμα περιεχομένου. Να δω αν το κρατάω στο scope.

  - id: F06_llms_txt
    name: Αρχείο llms.txt
    where: server
    how: Ανέβασμα του αρχείου στη ρίζα του site.
    resolves:
      - "Llms.txt not found"
    minutes: 10
    depends_on: []
    reaudit: false
    confidence: hypothesis
    source: "TODO"
    notes: Προαιρετικό, δεν επηρεάζει το ranking στη Google. Μάλλον εκτός scope.
