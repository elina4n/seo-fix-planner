# Κατάλογος διορθώσεων WordPress — η κύρια συνεισφορά της διπλωματικής.
#
# Κάθε διόρθωση λέει:
#   id            μοναδικός κωδικός (F01, F02, ...)
#   name          τι κάνεις, σε μία φράση
#   where         πού γίνεται: server | seo_plugin | caching_plugin | theme | content | other
#   how           σύντομα βήματα
#   resolves      ποια issues λύνει (ΑΚΡΙΒΩΣ τα ονόματα του severity_semrush.yaml)
#   minutes       εκτιμώμενος χρόνος — ΠΡΟΣΩΡΙΝΟΣ, θα χρονομετρηθεί σε κλώνους (D-005)
#   depends_on    διορθώσεις που πρέπει να γίνουν ΠΡΙΝ (μόνο σκληρές προϋποθέσεις)
#   reaudit       true αν μετά χρειάζεται νέο crawl, γιατί μπορεί να εμφανιστούν νέα issues
#   confidence    hypothesis (υπόθεση) | verified (επιβεβαιώθηκε στην πράξη)
#   source        τεκμηρίωση (paper, Google docs, plugin docs, δική σου δοκιμή)
#
# v0: καλύπτει μόνο τα issues του audit edge.dmsm2026.neuroverse.gr, 2026-10-04.

fixes:
  - id: F01_routing
    name: Επαναφορά δρομολόγησης WordPress (.htaccess / permalinks / document root)
    where: server
    how: >
      Έλεγχος στο cPanel σε ποιον φάκελο δείχνει το subdomain· ύπαρξη index.php και .htaccess
      με τους κανόνες του WordPress· Ρυθμίσεις → Μόνιμοι σύνδεσμοι → Αποθήκευση.
    resolves:
      - "4xx errors"
      - "Broken internal links"
      - "Sitemap.xml not found"
      - "Issues with incorrect hreflang links"
    minutes: 15
    depends_on: []
    reaudit: true
    confidence: hypothesis
    source: "TODO — WordPress docs (permalinks / .htaccess)· δική σου διάγνωση 2026-10-04"
    notes: >
      Οι εσωτερικές σελίδες επιστρέφουν 404 του Apache, άρα το αίτημα δεν φτάνει στο WordPress.
      Το audit είδε μόνο 22 URLs: μετά τη διόρθωση αναμένονται νέα, κρυμμένα issues.
      Το hreflang πιθανότατα λύνεται επειδή το /en/home/ θα σερβίρεται· να επιβεβαιωθεί.

  - id: F02_browser_caching
    name: Ενεργοποίηση browser caching για JS/CSS
    where: caching_plugin
    how: >
      Ενεργοποίηση browser cache στο caching plugin (π.χ. LiteSpeed Cache) ή κανόνες
      Cache-Control / Expires στο .htaccess.
    resolves:
      - "Uncached JavaScript and CSS files"
    minutes: 20
    depends_on: []
    reaudit: false
    confidence: hypothesis
    source: "TODO"

  - id: F03_hsts
    name: Προσθήκη header HSTS
    where: server
    how: >
      Header Strict-Transport-Security στο .htaccess ή μέσω security plugin.
      Μόνο αφού όλο το site και τα subdomains σερβίρονται σωστά μέσω HTTPS.
    resolves:
      - "No HSTS support"
    minutes: 10
    depends_on: []
    reaudit: false
    confidence: hypothesis
    source: "TODO"
    notes: "Ρίσκο: λάθος ρύθμιση HSTS μπορεί να κλειδώσει subdomains χωρίς HTTPS."

  - id: F04_home_meta_description
    name: Meta description στην αρχική σελίδα
    where: seo_plugin
    how: "Συμπλήρωση στο πεδίο του SEO plugin (Yoast / Rank Math) για την αρχική."
    resolves:
      - "Missing meta description"
    minutes: 5
    depends_on: []
    reaudit: false
    confidence: hypothesis
    source: "TODO"

  - id: F05_home_content
    name: Περισσότερο κείμενο στην αρχική σελίδα
    where: content
    how: "Προσθήκη ουσιαστικού κειμένου στην αρχική μέσω του block editor."
    resolves:
      - "Low word count"
      - "Low text to HTML ratio"
    minutes: 45
    depends_on: []
    reaudit: false
    confidence: hypothesis
    source: "TODO"
    notes: "Θέμα περιεχομένου, όχι τεχνικό· να αποφασιστεί αν μένει στο scope."

  - id: F06_llms_txt
    name: Δημιουργία αρχείου llms.txt
    where: server
    how: "Ανέβασμα αρχείου llms.txt στη ρίζα του site (ή μέσω plugin)."
    resolves:
      - "Llms.txt not found"
    minutes: 10
    depends_on: []
    reaudit: false
    confidence: hypothesis
    source: "TODO"
    notes: "Προαιρετικό· δεν είναι ranking factor της Google. Υποψήφιο για εκτός scope."
